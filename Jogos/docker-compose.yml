version: '3'

services:
  web:
    image: nginx:1.23.1-alpine
    restart: unless-stopped
    container_name: nginx
    environment:
      - NGINX_PORT=80
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./:/usr/share/nginx/html
    ports:
      - "4780:80"
