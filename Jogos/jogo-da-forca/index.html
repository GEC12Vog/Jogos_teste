<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Forca </title>
  <link rel="icon" type="image/png" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRuMxgFlhxxSmkDlvofpaat_i9AGcK0WFP7bfN4alRINA&s=10">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent-color: #a855f7;
      --accent-hover: #c084fc;
      --success-color: #22c55e;
      --error-color: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-main);
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    header {
      text-align: center;
      position: relative;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(to right, #c084fc, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .stats-bar {
      display: flex;
      justify-content: space-around;
      background: rgba(0, 0, 0, 0.2);
      padding: 12px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.95rem;
    }

    .stat-item span {
      font-weight: bold;
      color: var(--accent-hover);
    }

    .game-body {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      align-items: center;
      justify-content: center;
    }

    .canvas-container {
      flex: 1;
      min-width: 280px;
      max-width: 320px;
      display: flex;
      justify-content: center;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 16px;
      padding: 15px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    canvas {
      width: 100%;
      height: auto;
      max-width: 280px;
    }

    .interactive-zone {
      flex: 1.2;
      min-width: 300px;
      display: flex;
      flex-direction: column;
      gap: 25px;
      align-items: center;
    }

    .word-display {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      min-height: 60px;
      align-items: center;
    }

    .tm-display {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      min-height: 30px;
      align-items: center;
      color: var(--text-muted);
    }

    .letter-slot {
      width: 42px;
      height: 52px;
      border-bottom: 4px solid var(--accent-color);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2rem;
      font-weight: 700;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 6px 6px 0 0;
      transition: all 0.3s ease;
    }

    .letter-slot.revealed {
      color: var(--accent-hover);
      text-shadow: 0 0 10px rgba(192, 132, 252, 0.5);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .keyboard {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-width: 480px;
    }

    .key-btn {
      width: 38px;
      height: 44px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .key-btn:hover:not(:disabled) {
      background: var(--accent-color);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(168, 85, 247, 0.4);
    }

    .key-btn:disabled {
      cursor: not-allowed;
      opacity: 0.3;
    }

    .key-btn.correct {
      background: var(--success-color) !important;
      border-color: var(--success-color) !important;
      color: #fff;
      opacity: 0.9;
    }

    .key-btn.wrong {
      background: var(--error-color) !important;
      border-color: var(--error-color) !important;
      color: #fff;
      opacity: 0.4;
    }

    .controls {
      display: flex;
      gap: 12px;
      width: 100%;
      justify-content: center;
    }

    .btn-action {
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #a855f7 0%, #7c3aed 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(168, 85, 247, 0.5);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Modal / Popup */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #1e1b4b;
      border: 1px solid var(--accent-color);
      border-radius: 20px;
      padding: 35px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 10px 30px rgba(168, 85, 247, 0.3);
      transform: scale(0.8);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .modal-card h2 {
      font-size: 2rem;
      margin-bottom: 12px;
    }

    .modal-card.win h2 {
      color: var(--success-color);
    }

    .modal-card.lose h2 {
      color: var(--error-color);
    }

    .modal-card p {
      margin-bottom: 20px;
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .modal-card .secret-reveal {
      font-weight: bold;
      color: var(--text-main);
      font-size: 1.3rem;
      margin-top: 5px;
      display: block;
    }

    .sound-toggle {
      position: absolute;
      right: 0;
      top: 0;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
      transition: color 0.2s;
    }

    .sound-toggle:hover {
      color: var(--text-main);
    }

    @media (max-width: 600px) {
      .container { padding: 20px 15px; }
      header h1 { font-size: 1.8rem; }
      .letter-slot { width: 32px; height: 42px; font-size: 1.5rem; }
      .key-btn { width: 30px; height: 38px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Jogo da Forca</h1>
      <p>Adivinhe a palavra secreta antes que o boneco seja enforcado!</p>
      <button class="sound-toggle" id="soundToggle" title="Alternar som">🔊</button>
    </header>

    <div class="stats-bar">
      <div class="stat-item">Vitórias: <span id="winCount">0</span></div>
      <div class="stat-item">Derrotas: <span id="loseCount">0</span></div>
      <div class="stat-item">Erros: <span id="errorCount">0</span> / 6</div>
    </div>

    <div class="game-body">
      <div class="canvas-container">
        <canvas id="hangmanCanvas" width="280" height="280"></canvas>
      </div>

      <div class="interactive-zone">
        <div class="word-display" id="wordDisplay"></div>
        <div class="keyboard" id="keyboard"></div>
        <div class="controls">
          <button class="btn-action btn-primary" id="restartBtn">🔄 Novo Jogo</button>
          <button class="btn-action btn-secondary" id="addWordBtn">➕ Adicionar Palavra</button>
        </div>
      </div>
    </div>
    <div>
      <button class="btn-action btn-secondary" id="back" onclick="window.location.href='/'"> Voltar ao painel inicial </button>
    </div>
    <div class="tm-display">
      <p>©Dudu</p>
    </div>
    
  </div>

  <!-- Modal End Game -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card" id="modalCard">
      <h2 id="modalTitle">Você Venceu!</h2>
      <p id="modalMessage">Parabéns, você descobriu a palavra!</p>
      <button class="btn-action btn-primary" id="modalRestartBtn" style="margin: 0 auto;">Jogar Novamente</button>
    </div>
  </div>

  <script>
    // --- LISTA DE PALAVRAS ---
    // Incluindo as palavras da sua lista em Python e adicionando outras para dar mais variabilidade!
    let listaDePalavras = [
      "CHAVES", "KIKO", "PORTAO", "CHAVOSO", "FLOR", 
      "LINDA", "FLORINDA", "PORTO", "MICHAEL", "PROGRAMACAO", 
      "JAVASCRIPT", "PYTHON", "INTERNET", "DESENVOLVEDOR", "COMPUTADOR"
    ];

    // --- ESTADO DO JOGO ---
    let palavraSecreta = "";
    let letrasDigitadas = new Set();
    let erros = 0;
    const maxErros = 6;
    let vitorias = 0;
    let derrotas = 0;
    let somAtivo = true;

    // --- ELEMENTOS DO DOM ---
    const canvas = document.getElementById("hangmanCanvas");
    const ctx = canvas.getContext("2d");
    const wordDisplay = document.getElementById("wordDisplay");
    const keyboard = document.getElementById("keyboard");
    const errorCountElem = document.getElementById("errorCount");
    const winCountElem = document.getElementById("winCount");
    const loseCountElem = document.getElementById("loseCount");
    const restartBtn = document.getElementById("restartBtn");
    const modalOverlay = document.getElementById("modalOverlay");
    const modalCard = document.getElementById("modalCard");
    const modalTitle = document.getElementById("modalTitle");
    const modalMessage = document.getElementById("modalMessage");
    const modalRestartBtn = document.getElementById("modalRestartBtn");
    const soundToggle = document.getElementById("soundToggle");
    const addWordBtn = document.getElementById("addWordBtn");

    // --- AUDIO SINTETIZADO (Web Audio API) ---
    // Cria efeitos sonoros sem precisar carregar arquivos de áudio externos!
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (!somAtivo) return;
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'click') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
        osc.start(now);
        osc.stop(now + 0.05);
      } else if (type === 'hit') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(587.33, now); // D5
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      } else if (type === 'win') {
        // Melodia de vitória simples
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.connect(g);
          g.connect(audioCtx.destination);
          o.frequency.setValueAtTime(freq, now + idx * 0.1);
          g.gain.setValueAtTime(0.15, now + idx * 0.1);
          g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.1 + 0.2);
          o.start(now + idx * 0.1);
          o.stop(now + idx * 0.1 + 0.2);
        });
      } else if (type === 'lose') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(60, now + 0.4);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
        osc.start(now);
        osc.stop(now + 0.4);
      }
    }

    // --- DESENHO NO CANVAS ---
    function drawGallows() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';

      // Base
      ctx.beginPath();
      ctx.moveTo(20, 260);
      ctx.lineTo(150, 260);
      ctx.stroke();

      // Poste vertical
      ctx.beginPath();
      ctx.moveTo(60, 260);
      ctx.lineTo(60, 20);
      ctx.stroke();

      // Trave superior
      ctx.beginPath();
      ctx.moveTo(58, 20);
      ctx.lineTo(180, 20);
      ctx.stroke();

      // Corda
      ctx.beginPath();
      ctx.moveTo(180, 20);
      ctx.lineTo(180, 50);
      ctx.stroke();

      // Suporte diagonal
      ctx.beginPath();
      ctx.moveTo(60, 60);
      ctx.lineTo(100, 20);
      ctx.stroke();
    }

    function drawHangman(part) {
      ctx.strokeStyle = '#f8fafc';
      ctx.lineWidth = 3.5;

      switch(part) {
        case 1: // Cabeça
          ctx.beginPath();
          ctx.arc(180, 75, 25, 0, Math.PI * 2);
          ctx.stroke();
          break;
        case 2: // Tronco
          ctx.beginPath();
          ctx.moveTo(180, 100);
          ctx.lineTo(180, 170);
          ctx.stroke();
          break;
        case 3: // Braço Esquerdo
          ctx.beginPath();
          ctx.moveTo(180, 120);
          ctx.lineTo(145, 150);
          ctx.stroke();
          break;
        case 4: // Braço Direito
          ctx.beginPath();
          ctx.moveTo(180, 120);
          ctx.lineTo(215, 150);
          ctx.stroke();
          break;
        case 5: // Perna Esquerda
          ctx.beginPath();
          ctx.moveTo(180, 170);
          ctx.lineTo(150, 220);
          ctx.stroke();
          break;
        case 6: // Perna Direita
          ctx.beginPath();
          ctx.moveTo(180, 170);
          ctx.lineTo(210, 220);
          ctx.stroke();
          
          // Olhos em "X" para mostrar que foi enforcado
          ctx.strokeStyle = '#ef4444';
          ctx.lineWidth = 2;
          // Olho esquerdo
          ctx.beginPath();
          ctx.moveTo(170, 70); ctx.lineTo(176, 76);
          ctx.moveTo(176, 70); ctx.lineTo(170, 76);
          ctx.stroke();
          // Olho direito
          ctx.beginPath();
          ctx.moveTo(184, 70); ctx.lineTo(190, 76);
          ctx.moveTo(190, 70); ctx.lineTo(184, 76);
          ctx.stroke();
          break;
      }
    }

    // --- INICIALIZAÇÃO E CONTROLE DO JOGO ---
    function initGame() {
      // Sorteia uma palavra aleatória da lista
      const randomIndex = Math.floor(Math.random() * listaDePalavras.length);
      palavraSecreta = listaDePalavras[randomIndex].toUpperCase().trim();
      
      letrasDigitadas.clear();
      erros = 0;
      
      errorCountElem.textContent = erros;
      drawGallows();
      renderWordDisplay();
      createKeyboard();
      modalOverlay.classList.remove("active");
    }

    function renderWordDisplay() {
      wordDisplay.innerHTML = "";
      for (let letra of palavraSecreta) {
        const slot = document.createElement("div");
        slot.classList.add("letter-slot");
        if (letrasDigitadas.has(letra)) {
          slot.textContent = letra;
          slot.classList.add("revealed");
        } else {
          slot.textContent = "";
        }
        wordDisplay.appendChild(slot);
      }
    }

    function createKeyboard() {
      keyboard.innerHTML = "";
      const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
      alphabet.forEach(letra => {
        const btn = document.createElement("button");
        btn.classList.add("key-btn");
        btn.textContent = letra;
        btn.id = `key-${letra}`;
        btn.addEventListener("click", () => handleGuess(letra));
        keyboard.appendChild(btn);
      });
    }

    function handleGuess(letra) {
      if (letrasDigitadas.has(letra) || erros >= maxErros) return;

      letrasDigitadas.add(letra);
      const keyBtn = document.getElementById(`key-${letra}`);
      if (keyBtn) keyBtn.disabled = true;

      if (palavraSecreta.includes(letra)) {
        if (keyBtn) keyBtn.classList.add("correct");
        playSound('hit');
        renderWordDisplay();
        checkWin();
      } else {
        if (keyBtn) keyBtn.classList.add("wrong");
        erros++;
        errorCountElem.textContent = erros;
        playSound('wrong');
        drawHangman(erros);
        checkLose();
      }
    }

    function checkWin() {
      const venceu = palavraSecreta.split("").every(letra => letrasDigitadas.has(letra));
      if (venceu) {
        vitorias++;
        winCountElem.textContent = vitorias;
        playSound('win');
        showModal(true);
      }
    }

    function checkLose() {
      if (erros >= maxErros) {
        derrotas++;
        loseCountElem.textContent = derrotas;
        playSound('lose');
        showModal(false);
      }
    }

    function showModal(isWin) {
      setTimeout(() => {
        modalCard.className = `modal-card ${isWin ? 'win' : 'lose'}`;
        if (isWin) {
          modalTitle.textContent = "🎉 Você Venceu!";
          modalMessage.innerHTML = `Parabéns! Você descobriu a palavra:<span class="secret-reveal">${palavraSecreta}</span>`;
        } else {
          modalTitle.textContent = "☠️ Enforcado!";
          modalMessage.innerHTML = `Que pena! A palavra secreta era:<span class="secret-reveal">${palavraSecreta}</span>`;
        }
        modalOverlay.classList.add("active");
      }, 400);
    }

    // --- EVENTOS DE TECLADO FÍSICO ---
    window.addEventListener("keydown", (e) => {
      const key = e.key.toUpperCase();
      if (/^[A-Z]$/.test(key) && !modalOverlay.classList.contains("active")) {
        handleGuess(key);
      }
    });

    // --- BOTÕES E CONFIGURAÇÕES ---
    restartBtn.addEventListener("click", () => {
      playSound('click');
      initGame();
    });

    modalRestartBtn.addEventListener("click", () => {
      playSound('click');
      initGame();
    });

    soundToggle.addEventListener("click", () => {
      somAtivo = !somAtivo;
      soundToggle.textContent = somAtivo ? "🔊" : "🔇";
    });

    addWordBtn.addEventListener("click", () => {
      const novaPalavra = prompt("Digite uma nova palavra para adicionar ao jogo (sem acentos):");
      if (novaPalavra) {
        const limpa = novaPalavra.trim().toUpperCase().replace(/[^A-Z]/g, '');
        if (limpa.length >= 2) {
          listaDePalavras.push(limpa);
          alert(`Palavra "${limpa}" adicionada com sucesso!`);
        } else {
          alert("Palavra inválida! Use apenas letras sem acento.");
        }
      }
    });

    // Inicializa o jogo ao carregar
    initGame();
  </script>
</body>
</html>
