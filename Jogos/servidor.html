<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Servidor do Dudu
    </title>
    <link rel="icon" type="image/png" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRuMxgFlhxxSmkDlvofpaat_i9AGcK0WFP7bfN4alRINA&s=10">
    <style>
    :root {
        --bg-gradient: linear-gradient(140deg, #283b03 0%, #1b4b1f 50%, #10422f 100%);
        --card-bg: rgba(255, 255, 255, 0.05);
        --card-border: rgba(255, 255, 255, 0.12);
        --accent-color: #55f78b;
        --accent-hover: #84fcb2;
        --success-color: #229fc5;
        --error-color: #ef4444;
        --text-main: #f8fafc;
        --text-muted: #000000;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-main);
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    header {
      text-align: center;
      position: relative;
      align-items: start;
    }

    header h1 {
      font-size: 2.8rem;
      font-weight: 800;
      background: linear-gradient(to right, #0226f1, #000405);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      align-items: start;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.5rem;
    }
    button {
        color: #f8fafc;
        font-size: 1.5rem;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: black;
        border: 1px solid var(--card-border);
        border-radius: 16px;
        padding: 15px;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }
    .botaoJogos {
        display: flex;
        align-items: center;
        justify-content: center;
    }
    button {
        margin-top: 30px;
        margin-left: 30px;
        margin-right: 30px;
        padding: 18px 28px;
        font-size: 1.5rem;
        font-weight: bold;
        color: #fff;
        background-color: #000000;
        border: none;
        border-radius: 20px;
        cursor: pointer;
    }
    </style>
</head>
<body>
    <div class="container">
        <div class="container">
            <header>
                <h1>Bem vindo ao meu "Servidor"</h1>
                <p>Aqui teremos alguns 'sites' que você poderá utilizar de forma local, aproveite:</p>
            </header>
        </div>
        <div>
            <div>
                <div class="botaoJogos">
                <button id="jogoDaVelha" onclick="window.location.href='http://192.168.250.21:4780'"> Jogo da velha </button>
                <button id="jogoDaForca" onclick="window.location.href='http://192.168.250.21:4780/jogo-da-forca/'""> Jogo da forca </button>
                </div>
                <div class="botaoJogos">
                <button id="archives" onclick="window.location.href='http://192.168.250.21:4780/archives/'"">Ver arquivos</button>
                <button id="futuramente" onclick="window.location.href='http://192.168.250.21:4780/futuramente/'">Sem mais ideias</button>
                </div>
            </div>
        </div>
    </div>
</body>
<script>
    const jogoDaVelhaBtn = document.querySelector('#jogoDaVelha');
    const jogoDaForcaBtn = document.querySelector('#jogoDaForca');
    const archivesBtn = document.querySelector('#archives');
    const futuramenteBtn = document.querySelector('#futuramente');

    jogoDaForcaBtn.addEventListener('click')
    jogoDaVelhaBtn.addEventListener('click')
    archivesBtn.addEventListener('click')
    futuramenteBtn.addEventListener('click')

</script>
</html>
